name: Implement Image Draw Bot rc23

on:
  push:
    branches: [main]
    paths:
      - '.github/implement-rc23-trigger'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply rc23 Region Brush ROI patch
        run: python .github/scripts/implement_rc23.py
      - name: Compile touched planner
        run: python -m py_compile AdaptiveRegionHybrid.py ExecutionCostModel.py
      - name: Run rc23 focused regressions
        run: >-
          python -m unittest -v
          test_rc23_region_brush_roi.py
          test_rc6_region_brush_packing.py
          test_rc22_learned_cursor_travel.py
          test_rc21_cost_model_cleanup.py
          test_rc20_pixel_execution_cost.py
          test_rc19_extra_fast_execution_cost.py
          test_rc18_unified_region_fill_cost.py
          test_rc17_unified_execution_cost_eta.py
          test_engine_finalization_v10132.py
          test_extra_fast_review.py
      - name: Commit rc23
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AdaptiveRegionHybrid.py Version.py installer/ImageDrawBot.iss README.md docs README-INDEX.md VERSION-HISTORY.md RELEASE-NOTES-v1.0.145-rc23.md test_*.py
          git commit -m 'Release Image Draw Bot v1.0.145-rc23'
          git push origin HEAD:main

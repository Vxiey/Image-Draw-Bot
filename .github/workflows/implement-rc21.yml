name: Implement Image Draw Bot rc21

on:
  push:
    branches: [main]
    paths:
      - '.github/implement-rc21-trigger'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply rc21 cost-model cleanup patch
        run: python .github/scripts/run_rc21_retry.py
      - name: Compile touched modules
        run: python -m py_compile RegionFillEngine.py benchmark_engine.py PixelStrokeEngine.py ExecutionCostModel.py
      - name: Run rc21 focused regressions
        run: >-
          python -m unittest -v
          test_rc21_cost_model_cleanup.py
          test_hybrid_cost_engine_v10131.py
          test_rc5_smart_fill.py
          test_region_fill_v10117.py
          test_rc18_unified_region_fill_cost.py
          test_rc20_pixel_execution_cost.py
          test_rc19_extra_fast_execution_cost.py
          test_rc17_unified_execution_cost_eta.py
          test_engine_finalization_v10132.py
      - name: Engine benchmark smoke
        run: python benchmark_engine.py --output /tmp/engine-rc21.json --repeats 1 --workers 1
      - name: Commit rc21
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RegionFillEngine.py benchmark_engine.py Version.py installer/ImageDrawBot.iss README.md docs README-INDEX.md VERSION-HISTORY.md RELEASE-NOTES-v1.0.145-rc21.md test_*.py
          git commit -m 'Release Image Draw Bot v1.0.145-rc21'
          git push origin HEAD:main

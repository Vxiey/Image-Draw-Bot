name: Implement Image Draw Bot rc20

on:
  push:
    branches: [main]
    paths:
      - '.github/implement-rc20-trigger'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply rc20 Pixel Accurate execution-cost patch
        run: python .github/scripts/implement_rc20.py
      - name: Repair rc20 coverage test API
        run: python .github/scripts/fix_rc20_test.py
      - name: Compile touched modules
        run: python -m py_compile PixelStrokeEngine.py ExecutionCostModel.py
      - name: Run rc20 focused regressions
        run: >-
          python -m unittest -v
          test_rc20_pixel_execution_cost.py
          test_pixel_stroke_engine_v1087.py
          test_pixel_accuracy_engine_v1088.py
          test_pixel_performance_v1089.py
          test_engine_finalization_v10132.py
          test_subject_focus_v1090.py
          test_draw_motor_v1090.py
          test_rc19_extra_fast_execution_cost.py
          test_rc18_unified_region_fill_cost.py
          test_rc17_unified_execution_cost_eta.py
      - name: Commit rc20
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PixelStrokeEngine.py Version.py installer/ImageDrawBot.iss README.md docs README-INDEX.md VERSION-HISTORY.md RELEASE-NOTES-v1.0.145-rc20.md test_*.py
          git commit -m 'Release Image Draw Bot v1.0.145-rc20'
          git push origin HEAD:main

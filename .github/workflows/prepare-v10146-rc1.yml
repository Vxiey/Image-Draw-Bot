name: Prepare v1.0.146-rc1

on:
  push:
    branches:
      - release/v1.0.146-rc1

permissions:
  contents: write

jobs:
  prepare-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip

      - name: Roll version metadata to 1.0.146-rc1
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          root = Path('.')
          old_app = '1.0.145-rc29'
          new_app = '1.0.146-rc1'
          old_file = '1.0.145'
          new_file = '1.0.146'

          def replace_text(path: Path, replacements):
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  print(f'updated {path.as_posix()}')

          replace_text(root / 'Version.py', [
              (f"APP_VERSION = '{old_app}'", f"APP_VERSION = '{new_app}'"),
              (f"FILE_VERSION = '{old_file}'", f"FILE_VERSION = '{new_file}'"),
          ])
          replace_text(root / 'version_info.txt', [
              ('filevers=(1,0,145,0)', 'filevers=(1,0,146,0)'),
              ('prodvers=(1,0,145,0)', 'prodvers=(1,0,146,0)'),
              ("StringStruct('FileVersion', '1.0.145')", "StringStruct('FileVersion', '1.0.146')"),
              ("StringStruct('ProductVersion', '1.0.145')", "StringStruct('ProductVersion', '1.0.146')"),
          ])
          replace_text(root / 'installer' / 'ImageDrawBot.iss', [
              (f'#define MyAppVersion "{old_app}"', f'#define MyAppVersion "{new_app}"'),
          ])
          replace_text(root / 'README.md', [(old_app, new_app)])

          # Feature/regression tests historically assert the repository's current
          # release metadata. Update only exact current-version literals; do not
          # rewrite historical rc1..rc28 strings embedded in scenarios/docs.
          for path in root.glob('test_*.py'):
              replace_text(path, [
                  (f"'{old_app}'", f"'{new_app}'"),
                  (f'"{old_app}"', f'"{new_app}"'),
                  (f"'{old_file}'", f"'{new_file}'"),
                  (f'"{old_file}"', f'"{new_file}"'),
              ])

          notes = root / f'RELEASE-NOTES-v{new_app}.md'
          notes.write_text(
              '# Image Draw Bot v1.0.146-rc1 — Release Build Recovery\n\n'
              '- Start the 1.0.146 release-candidate line from the merged 1.0.145-rc29 stability/planner baseline.\n'
              '- Fix the Windows PyInstaller release command so `DrawingStyleProfiles` is passed as its own explicit hidden import instead of a stray positional script argument.\n'
              '- Keep the rc29 Preview/Draw generation guard, trusted completed-drawing ETA learning, background removal, drawing-style profiles, Extra Fast cost planning, Pixel Accurate correction pipeline and profile isolation unchanged.\n'
              '- Add regression coverage for the PyInstaller hidden-import list so the Windows release build cannot regress in the same way silently.\n'
              '- Validate source hygiene, release metadata, the complete unit-regression suite, self-test and Windows installer build before merging.\n',
              encoding='utf-8',
          )

          history_entry = (
              '# Image Draw Bot v1.0.146-rc1 — Release Build Recovery\n\n'
              '- New RC line based on 1.0.145-rc29.\n'
              '- Windows release packaging fixes `DrawingStyleProfiles` PyInstaller argument ordering and adds a focused regression test.\n'
              '- Runtime drawing/planner behavior is intentionally unchanged from the validated rc29 baseline.\n\n'
          )
          for rel in ('VERSION-HISTORY.md', 'docs/VERSION-HISTORY.md'):
              path = root / rel
              if path.exists():
                  text = path.read_text(encoding='utf-8')
                  if not text.startswith('# Image Draw Bot v1.0.146-rc1'):
                      path.write_text(history_entry + text, encoding='utf-8')

          # This workflow is a temporary branch bootstrap only. Remove it from the
          # final source tree before release hygiene checks and before committing.
          bootstrap = root / '.github' / 'workflows' / 'prepare-v10146-rc1.yml'
          if bootstrap.exists():
              bootstrap.unlink()
          '@ | python -

      - name: Install source dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Source package hygiene gate
        shell: pwsh
        run: |
          python ReleasePackage.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Release source gate
        shell: pwsh
        run: |
          python ReleaseCandidateHardening.py --source-gate --soak-cycles 5000
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run complete regressions and self-test
        shell: pwsh
        run: |
          python -m unittest discover -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python DrawBot.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build verified Windows release
        shell: pwsh
        run: |
          python build_release.py --installer --skip-tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit validated release metadata
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- Version.py version_info.txt installer/ImageDrawBot.iss README.md VERSION-HISTORY.md docs/VERSION-HISTORY.md RELEASE-NOTES-v1.0.146-rc1.md 'test_*.py' .github/workflows/prepare-v10146-rc1.yml
          if (git diff --cached --quiet) { throw 'No version changes were staged.' }
          git commit -m "Release Image Draw Bot v1.0.146-rc1"
          git push origin HEAD:release/v1.0.146-rc1

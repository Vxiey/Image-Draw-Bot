name: Implement Image Draw Bot rc16

on:
  push:
    branches: [main]
    paths:
      - '.github/implement-rc16-trigger'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply rc16 preview planner parity patch
        run: python .github/scripts/implement_rc16.py
      - name: Migrate rc16 preview worker regression expectation
        run: python .github/scripts/migrate_rc16_tests.py
      - name: Compile touched preview modules
        run: python -m py_compile PreviewQuality.py DrawBot.py StudioUI.py
      - name: Run rc16 focused regressions
        run: >-
          python -m unittest -v
          test_rc16_preview_parity.py
          test_preview_quality_v104.py
          test_manual_preview_v1011.py
          test_detail_aware_preview_v10113.py
          test_smart_preview_safety_v1055.py
          test_safety_debug_overlay_v1056.py
          test_resource_allocation_v1014.py
      - name: Commit rc16
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PreviewQuality.py DrawBot.py StudioUI.py Version.py installer/ImageDrawBot.iss README.md docs README-INDEX.md VERSION-HISTORY.md RELEASE-NOTES-v1.0.145-rc16.md test_*.py
          git commit -m 'Release Image Draw Bot v1.0.145-rc16'
          git push origin HEAD:main

name: Implement Image Draw Bot rc17

on:
  push:
    branches: [main]
    paths:
      - '.github/implement-rc17-trigger'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply rc17 unified ETA patch
        run: python .github/scripts/implement_rc17.py
      - name: Migrate rc17 focused test expectation
        run: python .github/scripts/migrate_rc17_tests.py
      - name: Compile touched cost modules
        run: python -m py_compile ExecutionCostModel.py DrawTimeEstimate.py
      - name: Run rc17 focused regressions
        run: >-
          python -m unittest -v
          test_rc17_unified_execution_cost_eta.py
          test_draw_time_estimate_v10110.py
          test_bottleneck_fixes_v10146.py
          test_deadline_runtime_optimizer_v10119.py
          test_region_fill_v10117.py
          test_rc6_region_brush_packing.py
          test_step9_profile_calibration_isolation_v10133.py
          test_step12_auto_tuner_feedback_v10136.py
      - name: Commit rc17
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ExecutionCostModel.py DrawTimeEstimate.py Version.py installer/ImageDrawBot.iss README.md docs README-INDEX.md VERSION-HISTORY.md RELEASE-NOTES-v1.0.145-rc17.md test_*.py
          git commit -m 'Release Image Draw Bot v1.0.145-rc17'
          git push origin HEAD:main

name: Implement Image Draw Bot rc4

on:
  push:
    branches: [main]
    paths:
      - '.github/implement-rc4-trigger'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply rc4 five-brush CanvasGuard patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected rc4 patch anchor missing in {path}: {old[:80]!r}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          # BrowserBrushSize: full control-row verification is separate from the
          # initial guard. Legacy safe_guard_px is retained for old plans/fallbacks.
          replace('BrowserBrushSize.py',
          """    def as_dict(self):\n        return {\n            'profile_key':self.profile_key,'control_positions':[list(p) for p in self.control_positions],\n            'nominal_sizes':list(self.nominal_sizes),'target_index':int(self.target_index),\n            'selected_index':self.selected_index,'confidence':float(self.confidence),\n            'target_position':list(self.target_position) if self.target_position else None,\n            'requested_px':int(self.requested_px),'effective_px':int(self.effective_px),\n            'safe_guard_px':int(self.safe_guard_px),'method':self.method,\n        }\n""",
          """    def as_dict(self):\n        controls_verified=(bool(self.target_position) and float(self.confidence)>=.58 and\n                           len(self.control_positions)==len(self.nominal_sizes) and len(self.nominal_sizes)>1)\n        verified_sizes=list(map(int,self.nominal_sizes)) if controls_verified else []\n        return {\n            'profile_key':self.profile_key,'control_positions':[list(p) for p in self.control_positions],\n            'nominal_sizes':list(self.nominal_sizes),'verified_sizes':verified_sizes,\n            'dynamic_guard':bool(verified_sizes),'target_index':int(self.target_index),\n            'selected_index':self.selected_index,'confidence':float(self.confidence),\n            'target_position':list(self.target_position) if self.target_position else None,\n            'requested_px':int(self.requested_px),'effective_px':int(self.effective_px),\n            'safe_guard_px':int(self.safe_guard_px),'method':self.method,\n        }\n""")

          # AdaptiveBrushEngine: new plans can use every independently verified
          # preset. Old plans still obey safe_guard_px exactly as before.
          replace('AdaptiveBrushEngine.py',
          """    try:safe_guard=max(default,int(round(float(plan.get('safe_guard_px',default) or default))))\n    except (TypeError,ValueError):safe_guard=default\n    usable=tuple(v for v in sizes if v<=safe_guard)\n    if not usable:usable=(default,)\n    return usable,True\n""",
          """    explicit_verified=_unique_sizes(plan.get('verified_sizes'),default) if plan.get('verified_sizes') else ()\n    if explicit_verified:\n        verified_set=set(explicit_verified)\n        usable=tuple(v for v in sizes if v in verified_set)\n        if not usable:usable=(default,)\n        return usable,len(usable)>1\n    try:safe_guard=max(default,int(round(float(plan.get('safe_guard_px',default) or default))))\n    except (TypeError,ValueError):safe_guard=default\n    usable=tuple(v for v in sizes if v<=safe_guard)\n    if not usable:usable=(default,)\n    return usable,True\n""")
          replace('AdaptiveBrushEngine.py',"'engine':'Adaptive Brush Draw Motor v2','policy_version':4,",
                  "'engine':'Adaptive Brush Draw Motor v2','policy_version':5,")
          replace('AdaptiveBrushEngine.py',
                  "'quality_priority':'all verified sizes for safe broad regions; protected/detail paths use the smallest verified brush'}",
                  "'quality_priority':'all independently verified sizes for safe broad regions; protected/detail paths use the smallest verified brush','brush_aware_canvasguard':bool((browser_brush_plan or {}).get('verified_sizes'))}")

          # FinalMouseGuard can atomically swap the active brush-specific guard.
          replace('CanvasGuard.py',
          """    def move(self, x: int | float, y: int | float, context: str = 'drawing move') -> Point:\n        safe = self.canvas_guard.protect_point((x, y), context)\n""",
          """    def set_canvas_guard(self, canvas_guard: CanvasGuard) -> None:\n        if not isinstance(canvas_guard, CanvasGuard):\n            raise TypeError('FinalMouseGuard requires a CanvasGuard instance.')\n        self.canvas_guard = canvas_guard\n\n    def move(self, x: int | float, y: int | float, context: str = 'drawing move') -> Point:\n        safe = self.canvas_guard.protect_point((x, y), context)\n""")

          # DrawBot: use the actually selected brush for the initial guard when
          # the complete browser brush row was verified. Fallback plans keep the
          # old conservative global guard.
          replace('DrawBot.py',
          """    canvas_guard=CanvasGuard.from_area_or_polygon(area, polygon=canvas_polygon, coordinate_space=canvas_polygon_space,\n                                                  brush_px=plan['options'].get('canvas_guard_brush_px',plan['options'].get('brush_px',3)), edge_margin_px=2, anchors=canvas_anchors,\n                                                  confidence=float((plan['options'].get('canvas_anchor_meta') or {}).get('confidence',1.0)) if isinstance(plan['options'].get('canvas_anchor_meta'),dict) else 1.0)\n    draw_mouse=FinalMouseGuard(mouse, canvas_guard)\n""",
          """    _browser_guard_plan=plan['options'].get('browser_brush_plan') or {}\n    _dynamic_brush_guard=bool(_browser_guard_plan.get('verified_sizes'))\n    _initial_guard_brush=(plan['options'].get('brush_px',3) if _dynamic_brush_guard else\n                          plan['options'].get('canvas_guard_brush_px',plan['options'].get('brush_px',3)))\n    canvas_guard=CanvasGuard.from_area_or_polygon(area, polygon=canvas_polygon, coordinate_space=canvas_polygon_space,\n                                                  brush_px=_initial_guard_brush, edge_margin_px=2, anchors=canvas_anchors,\n                                                  confidence=float((plan['options'].get('canvas_anchor_meta') or {}).get('confidence',1.0)) if isinstance(plan['options'].get('canvas_anchor_meta'),dict) else 1.0)\n    draw_mouse=FinalMouseGuard(mouse, canvas_guard)\n""")

          replace('DrawBot.py',
          """        def switch_execution_brush(wanted_px):\n            \"\"\"Switch only between read-only verified browser brush controls.\"\"\"\n            nonlocal current_execution_brush\n""",
          """        def switch_execution_brush(wanted_px):\n            \"\"\"Switch only between verified controls and atomically install its brush-specific CanvasGuard.\"\"\"\n            nonlocal current_execution_brush, canvas_guard\n""")
          replace('DrawBot.py',
          """            # AdaptiveBrushEngine never assigns larger-than-preflight widths, but\n            # keep the runtime guard explicit in case a stale/custom plan reaches execution.\n            if effective>max(1,int(plan['options'].get('canvas_guard_brush_px',current_execution_brush) or current_execution_brush)):\n                return False\n            mouse.move(*position);wait(max(.025,stroke_delivery.ui_control_delay*.45))\n""",
          """            verified_sizes=[]\n            try:verified_sizes=[max(1,int(v)) for v in (brush_plan.get('verified_sizes') or ())]\n            except (TypeError,ValueError):verified_sizes=[]\n            # New rc4 plans prove every usable control independently, so safety is\n            # enforced by a fresh CanvasGuard for the *actual* brush. Legacy plans\n            # keep the old global-guard ceiling.\n            if verified_sizes:\n                if effective not in verified_sizes:return False\n            elif effective>max(1,int(plan['options'].get('canvas_guard_brush_px',current_execution_brush) or current_execution_brush)):\n                return False\n            mouse.move(*position);wait(max(.025,stroke_delivery.ui_control_delay*.45))\n""")
          replace('DrawBot.py',
          """            current_execution_brush=effective\n            plan['options'].setdefault('adaptive_brush_runtime_meta',{'switches':0,'sizes':[]})\n""",
          """            current_execution_brush=effective\n            if verified_sizes:\n                canvas_guard=CanvasGuard.from_area_or_polygon(\n                    area, polygon=canvas_polygon, coordinate_space=canvas_polygon_space,\n                    brush_px=effective, edge_margin_px=2, anchors=canvas_anchors,\n                    confidence=float((plan['options'].get('canvas_anchor_meta') or {}).get('confidence',1.0)) if isinstance(plan['options'].get('canvas_anchor_meta'),dict) else 1.0)\n                draw_mouse.set_canvas_guard(canvas_guard)\n                plan['options']['canvas_guard_meta']=canvas_guard.model.as_dict()\n            plan['options'].setdefault('adaptive_brush_runtime_meta',{'switches':0,'sizes':[],'brush_aware_canvasguard':bool(verified_sizes)})\n""")

          # Version and current-release surfaces. Historical rc3 notes remain intact.
          Path('Version.py').write_text(Path('Version.py').read_text(encoding='utf-8').replace("APP_VERSION = '1.0.145-rc3'","APP_VERSION = '1.0.145-rc4'"),encoding='utf-8')
          for p in Path('.').glob('test_*.py'):
              text=p.read_text(encoding='utf-8')
              if "APP_VERSION,'1.0.145-rc3'" in text or 'APP_VERSION,\'1.0.145-rc3\'' in text:
                  p.write_text(text.replace("APP_VERSION,'1.0.145-rc3'","APP_VERSION,'1.0.145-rc4'").replace("APP_VERSION, '1.0.145-rc3'","APP_VERSION, '1.0.145-rc4'"),encoding='utf-8')
          installer=Path('installer/ImageDrawBot.iss')
          installer.write_text(installer.read_text(encoding='utf-8').replace('#define MyAppVersion "1.0.145-rc3"','#define MyAppVersion "1.0.145-rc4"'),encoding='utf-8')
          for name in ('README.md','docs/wiki/Installation.md','docs/README.md','README-INDEX.md','docs/wiki/Home.md','docs/wiki/Updates.md'):
              p=Path(name);p.write_text(p.read_text(encoding='utf-8').replace('1.0.145-rc3','1.0.145-rc4'),encoding='utf-8')

          notes='''# Image Draw Bot v1.0.145-rc4 — Gartic Five-Brush CanvasGuard\n\n- Enable the complete verified Gartic brush ladder: 2 / 4 / 8 / 16 / 28 px.\n- Separate brush-control verification from the legacy one-upshift CanvasGuard ceiling.\n- Rebuild CanvasGuard at runtime for the brush that is actually selected, instead of reserving the largest brush inset for the whole drawing.\n- Keep legacy/fallback browser plans on the previous conservative global guard behavior.\n- Preserve the smallest verified brush for protected details, correction paths and fine-detail passes.\n- Keep brush switches in the execution sequence so ETA continues to charge their real UI cost.\n'''
          Path('RELEASE-NOTES-v1.0.145-rc4.md').write_text(notes,encoding='utf-8')
          history='''# Image Draw Bot v1.0.145-rc4 — Gartic Five-Brush CanvasGuard\n\n- Verified Gartic controls can use 2 / 4 / 8 / 16 / 28 px with a brush-specific CanvasGuard.\n- A broad brush no longer forces its safety inset onto every path in the render.\n- Legacy/unverified controls retain the conservative global guard fallback.\n\n'''
          for name in ('VERSION-HISTORY.md','docs/VERSION-HISTORY.md'):
              p=Path(name);p.write_text(history+p.read_text(encoding='utf-8'),encoding='utf-8')

          test='''import unittest\nfrom pathlib import Path\nfrom AdaptiveBrushEngine import verified_brush_sizes, assign_adaptive_brushes\nfrom CanvasGuard import CanvasGuard, FinalMouseGuard\n\nclass Mouse:\n    def move(self,*a): pass\n    def press(self): pass\n    def click(self): pass\n    def release(self): pass\n\nclass Rc4Tests(unittest.TestCase):\n    def plan(self):\n        return {\"nominal_sizes\":[2,4,8,16,28],\"verified_sizes\":[2,4,8,16,28],\"control_positions\":[[1,1],[2,1],[3,1],[4,1],[5,1]],\"target_position\":[2,1],\"confidence\":.9,\"safe_guard_px\":8}\n    def test_full_verified_ladder_ignores_legacy_guard(self):\n        sizes,dynamic=verified_brush_sizes('gartic-phone',self.plan(),4)\n        self.assertTrue(dynamic);self.assertEqual(sizes,(2,4,8,16,28))\n    def test_legacy_plan_still_obeys_guard(self):\n        p=self.plan();p.pop('verified_sizes')\n        sizes,dynamic=verified_brush_sizes('gartic-phone',p,4)\n        self.assertTrue(dynamic);self.assertEqual(sizes,(2,4,8))\n    def test_large_foundation_can_reach_28(self):\n        e={\"color_index\":0,\"path\":((10,10),(190,10)),\"phase\":\"foundation\",\"protected\":False,\"importance\":.1,\"component_width\":200,\"component_height\":120,\"component_area\":24000}\n        r=assign_adaptive_brushes([e,e,e],profile_key='gartic-phone',default_brush_px=4,browser_brush_plan=self.plan())\n        self.assertIn(28,r['metadata']['used_brush_sizes'])\n    def test_final_mouse_guard_can_swap_inset(self):\n        fg=FinalMouseGuard(Mouse(),CanvasGuard.from_area((0,0,200,200),brush_px=2))\n        fg.set_canvas_guard(CanvasGuard.from_area((0,0,200,200),brush_px=28))\n        self.assertEqual(fg.canvas_guard.model.brush_inset.brush_px,28)\n    def test_drawbot_uses_brush_specific_guard(self):\n        src=Path('DrawBot.py').read_text(encoding='utf-8')\n        self.assertIn('draw_mouse.set_canvas_guard(canvas_guard)',src)\n        self.assertIn("brush_plan.get('verified_sizes')",src)\n\nif __name__=='__main__':unittest.main()\n'''
          Path('test_rc4_brush_canvasguard.py').write_text(test,encoding='utf-8')
          PY
      - name: Run rc4 regressions
        run: python -m unittest -v test_rc4_brush_canvasguard.py test_auto_brush_selector.py test_draw_motor_v1090.py
      - name: Commit rc4
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BrowserBrushSize.py AdaptiveBrushEngine.py CanvasGuard.py DrawBot.py Version.py installer/ImageDrawBot.iss README.md docs README-INDEX.md VERSION-HISTORY.md RELEASE-NOTES-v1.0.145-rc4.md test_*.py
          git commit -m 'Release Image Draw Bot v1.0.145-rc4'
          git push origin HEAD:main

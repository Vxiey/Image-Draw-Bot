name: Implement Image Draw Bot rc18

on:
  push:
    branches: [main]
    paths:
      - '.github/implement-rc18-trigger'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply rc18 unified Region Fill cost patch
        run: python .github/scripts/implement_rc18.py
      - name: Compile touched Fill modules
        run: python -m py_compile RegionFillEngine.py ExecutionCostModel.py DrawTimeEstimate.py
      - name: Run rc18 focused regressions
        run: >-
          python -m unittest -v
          test_rc18_unified_region_fill_cost.py
          test_rc17_unified_execution_cost_eta.py
          test_rc5_smart_fill.py
          test_region_fill_v10117.py
          test_bottleneck_fixes_v10146.py
          test_extra_fast_review.py
          test_rc6_region_brush_packing.py
          test_deadline_runtime_optimizer_v10119.py
      - name: Commit rc18
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RegionFillEngine.py Version.py installer/ImageDrawBot.iss README.md docs README-INDEX.md VERSION-HISTORY.md RELEASE-NOTES-v1.0.145-rc18.md test_*.py
          git commit -m 'Release Image Draw Bot v1.0.145-rc18'
          git push origin HEAD:main

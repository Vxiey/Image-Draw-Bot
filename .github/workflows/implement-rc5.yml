name: Implement Image Draw Bot rc5

on:
  push:
    branches: [main]
    paths:
      - '.github/implement-rc5-trigger'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply rc5 Smart Fill patch
        run: python .github/scripts/implement_rc5.py
      - name: Run rc5 focused regressions
        run: python -m unittest -v test_rc5_smart_fill.py test_region_fill_v10117.py test_bottleneck_fixes_v10146.py test_extra_fast_review.py
      - name: Commit rc5
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RegionFillEngine.py DrawBot.py Version.py installer/ImageDrawBot.iss README.md docs README-INDEX.md VERSION-HISTORY.md RELEASE-NOTES-v1.0.145-rc5.md test_*.py
          git commit -m 'Release Image Draw Bot v1.0.145-rc5'
          git push origin HEAD:main

name: Image Draw Bot CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: image-draw-bot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-security:
    name: dependencies-${{ matrix.os }}-py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: windows-latest
            python-version: '3.12'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Audit application, test, and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pip-audit>=2.10.1,<3'
          python -m pip_audit --strict -r requirements.txt -r requirements-dev.txt -r requirements-build.txt -r requirements-gpu-universal.txt -r requirements-gpu-nvidia.txt

  planner-core:
    name: core-${{ matrix.os }}-py312
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate source package hygiene
        run: python ReleasePackage.py --check

      - name: Run exact raster and portable planner regressions
        run: >-
          python -m unittest -v
          test_raster_identity.py
          test_raster_identity_property.py
          test_extra_fast_review.py
          test_hybrid_cost_engine_v10131.py
          test_engine_finalization_v10132.py
          test_step17_golden_image_regression_v10141.py

      - name: Run Extra Fast benchmark smoke
        run: python benchmark_extra_fast.py

      - name: Run complete regressions
        run: python -m unittest discover -v

      - name: Run Image Draw Bot Windows self-test
        if: runner.os == 'Windows'
        run: python DrawBot.py --self-test

      - name: Build and validate the Windows bundle
        if: runner.os == 'Windows'
        run: python build_release.py --skip-tests

      - name: Verify packaged GUI and native drag and drop
        if: runner.os == 'Windows'
        run: >-
          python -c "import subprocess; subprocess.run(
          ['dist/ImageDrawBot/ImageDrawBot.exe', '--smoke-test'],
          check=True, timeout=90)"

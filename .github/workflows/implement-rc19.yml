name: Implement Image Draw Bot rc19

on:
  push:
    branches: [main]
    paths:
      - '.github/implement-rc19-trigger'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply rc19 Extra Fast execution-cost patch
        run: python .github/scripts/implement_rc19.py
      - name: Repair rc19 class indentation
        run: python .github/scripts/fix_rc19_class_indent.py
      - name: Compile touched cost modules
        run: python -m py_compile ExecutionCostModel.py ExtraFast2.py ExecutionTelemetry.py benchmark_extra_fast.py
      - name: Run rc19 focused regressions
        run: >-
          python -m unittest -v
          test_rc19_extra_fast_execution_cost.py
          test_extra_fast_review.py
          test_step7_extra_fast2_v10131.py
          test_semantic_barriers_v10139.py
          test_gpu_pipeline_optimization.py
          test_execution_telemetry.py
          test_rc18_unified_region_fill_cost.py
          test_rc17_unified_execution_cost_eta.py
          test_bottleneck_fixes_v10146.py
      - name: Run Extra Fast benchmark smoke
        run: python benchmark_extra_fast.py > /tmp/extra-fast-rc19.json
      - name: Commit rc19
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ExecutionCostModel.py ExtraFast2.py ExecutionTelemetry.py benchmark_extra_fast.py Version.py installer/ImageDrawBot.iss README.md docs README-INDEX.md VERSION-HISTORY.md RELEASE-NOTES-v1.0.145-rc19.md test_*.py
          git commit -m 'Release Image Draw Bot v1.0.145-rc19'
          git push origin HEAD:main

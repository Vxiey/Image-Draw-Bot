name: Implement Image Draw Bot rc15

on:
  push:
    branches: [main]
    paths:
      - '.github/implement-rc15-trigger'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply rc15 CPU GPU performance patch
        run: python .github/scripts/implement_rc15.py
      - name: Compile touched performance modules
        run: python -m py_compile GpuAcceleration.py PixelAccuracyGpu.py UniversalGpuAcceleration.py ResourceScheduler.py
      - name: Run rc15 focused regressions
        run: >-
          python -m unittest -v
          test_rc15_cpu_gpu_performance.py
          test_gpu_memory_fill_v106.py
          test_pixel_performance_v1089.py
          test_draw_motor_v1090.py
          test_resource_scheduler_v1044.py
          test_deadline_runtime_optimizer_v10119.py
          test_merge_v1091.py
      - name: Commit rc15
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add GpuAcceleration.py PixelAccuracyGpu.py UniversalGpuAcceleration.py ResourceScheduler.py Version.py installer/ImageDrawBot.iss README.md docs README-INDEX.md VERSION-HISTORY.md RELEASE-NOTES-v1.0.145-rc15.md test_*.py
          git commit -m 'Release Image Draw Bot v1.0.145-rc15'
          git push origin HEAD:main

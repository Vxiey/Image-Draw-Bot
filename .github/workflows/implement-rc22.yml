name: Implement Image Draw Bot rc22

on:
  push:
    branches: [main]
    paths:
      - '.github/implement-rc22-trigger'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply rc22 learned cursor-travel patch
        run: python .github/scripts/implement_rc22.py
      - name: Compile shared execution model
        run: python -m py_compile ExecutionCostModel.py
      - name: Run rc22 focused regressions
        run: >-
          python -m unittest -v
          test_rc22_learned_cursor_travel.py
          test_rc17_unified_execution_cost_eta.py
          test_rc19_extra_fast_execution_cost.py
          test_rc20_pixel_execution_cost.py
          test_rc21_cost_model_cleanup.py
          test_engine_finalization_v10132.py
          test_deadline_runtime_optimizer_v10119.py
          test_rc12_eta_calibration.py
          test_step12_auto_tuner_feedback_v10136.py
      - name: Commit rc22
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ExecutionCostModel.py Version.py installer/ImageDrawBot.iss README.md docs README-INDEX.md VERSION-HISTORY.md RELEASE-NOTES-v1.0.145-rc22.md test_*.py
          git commit -m 'Release Image Draw Bot v1.0.145-rc22'
          git push origin HEAD:main

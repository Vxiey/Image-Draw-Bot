name: Implement Image Draw Bot rc14

on:
  push:
    branches: [main]
    paths:
      - '.github/implement-rc14-trigger'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply rc14 Resume and Checkpoints patch
        run: python .github/scripts/implement_rc14.py
      - name: Run rc14 focused regressions
        run: >-
          python -m unittest -v
          test_rc14_sequence_resume.py
          test_render_resume_v1042.py
          test_smart_recovery_resume_v1079.py
          test_rc8_dynamic_replanner.py
          test_rc9_progressive_drawing.py
          test_step8_deadline_scheduler_panic_v10132.py
          test_step9_profile_calibration_isolation_v10133.py
      - name: Commit rc14
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RenderResume.py SmartRecovery.py DrawBot.py SessionRecovery.py Version.py installer/ImageDrawBot.iss README.md docs README-INDEX.md VERSION-HISTORY.md RELEASE-NOTES-v1.0.145-rc14.md test_*.py
          git commit -m 'Release Image Draw Bot v1.0.145-rc14'
          git push origin HEAD:main

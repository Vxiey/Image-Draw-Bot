name: Implement Image Draw Bot rc13

on:
  push:
    branches: [main]
    paths:
      - '.github/implement-rc13-trigger'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply rc13 Calibration and Recovery patch
        run: python .github/scripts/implement_rc13.py
      - name: Run rc13 focused regressions
        run: >-
          python -m unittest -v
          test_rc13_calibration_recovery.py
          test_browser_auto_recalibration_v1071.py
          test_browser_auto_calibration_v1070.py
          test_step9_profile_calibration_isolation_v10133.py
          test_target_rebase.py
          test_precision_v102.py
      - name: Commit rc13
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CalibrationHealth.py BrowserAutoRecalibration.py CalibrationState.py BrowserOneClick.py DrawBot.py build_exe.py Version.py installer/ImageDrawBot.iss README.md docs README-INDEX.md VERSION-HISTORY.md RELEASE-NOTES-v1.0.145-rc13.md test_*.py
          git commit -m 'Release Image Draw Bot v1.0.145-rc13'
          git push origin HEAD:main

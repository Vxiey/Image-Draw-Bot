name: Build and publish Image Draw Bot Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'Version.py'
      - '.github/release-build-trigger'

permissions:
  contents: write

concurrency:
  group: image-draw-bot-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'

      - name: Install source dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Source package hygiene gate
        shell: pwsh
        run: |
          python ReleasePackage.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Release source gate
        shell: pwsh
        run: |
          python ReleaseCandidateHardening.py --source-gate --soak-cycles 5000
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run complete regressions and self-test
        shell: pwsh
        run: |
          python -m unittest discover -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python DrawBot.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build verified Windows release
        shell: pwsh
        run: |
          python build_release.py --installer --skip-tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate packaged release
        shell: pwsh
        run: |
          python ReleaseCandidateHardening.py --release-dir release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate silent installer round-trip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem release/ImageDrawBot-*-Windows-x64-Setup.exe | Select-Object -First 1
          if (-not $setup) { throw 'Setup.exe was not produced' }

          $installDir = Join-Path $env:RUNNER_TEMP 'ImageDrawBot-release-install'
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }

          Write-Host "Installing $($setup.Name) to $installDir"
          $installProcess = Start-Process -FilePath $setup.FullName `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$installDir") `
            -Wait -PassThru
          Write-Host "Installer exit code: $($installProcess.ExitCode)"
          if ($installProcess.ExitCode -ne 0) { throw "Silent install failed: $($installProcess.ExitCode)" }

          $exe = Join-Path $installDir 'ImageDrawBot.exe'
          if (-not (Test-Path $exe)) { throw "Installed ImageDrawBot.exe is missing at $exe" }
          $icon = Join-Path $installDir '_internal\assets\image-draw-bot-icon.ico'
          if (-not (Test-Path $icon)) { throw "Installed taskbar icon is missing: $icon" }
          $shortcutPath = Join-Path ([Environment]::GetFolderPath('Programs')) 'Image Draw Bot/Image Draw Bot.lnk'
          if (-not (Test-Path $shortcutPath)) { throw 'Start-menu shortcut is missing' }
          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $shell.CreateShortcut($shortcutPath)
          if ($shortcut.IconLocation -ne "$icon,0") { throw "Shortcut uses unexpected icon: $($shortcut.IconLocation)" }
          Write-Host 'Installed shortcut icon verified'
          Write-Host 'Running installed ImageDrawBot.exe --self-test'
          $selfTestProcess = Start-Process -FilePath $exe -ArgumentList @('--self-test') -Wait -PassThru
          Write-Host "Installed self-test exit code: $($selfTestProcess.ExitCode)"
          if ($selfTestProcess.ExitCode -ne 0) { throw "Installed self-test failed: $($selfTestProcess.ExitCode)" }

          $uninstall = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path $uninstall)) { throw "Uninstaller is missing at $uninstall" }
          Write-Host 'Running silent uninstall'
          $uninstallProcess = Start-Process -FilePath $uninstall -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          Write-Host "Uninstaller exit code: $($uninstallProcess.ExitCode)"
          if ($uninstallProcess.ExitCode -ne 0) { throw "Silent uninstall failed: $($uninstallProcess.ExitCode)" }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImageDrawBot-${{ github.ref_name }}-Windows-x64
          path: |
            release/ImageDrawBot-*-Windows-x64.zip
            release/ImageDrawBot-*-Windows-x64-Setup.exe
            release/ImageDrawBot-*-SHA256.txt
            release/ImageDrawBot-*-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified versioned release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from Version import APP_VERSION; print(APP_VERSION)"
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Tag does not match build version' }
          $existing = gh release view $tag --json isDraft,targetCommitish 2>$null
          $resumeDraft = $false
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            if (-not $release.isDraft) {
              Write-Host 'This version is already published. Increment APP_VERSION to publish an update.'
              exit 0
            }
            if ($release.targetCommitish -ne $env:GITHUB_SHA) { throw 'Draft belongs to a different commit; use a new version.' }
            $resumeDraft = $true
          }
          $notes = "RELEASE-NOTES-v$version.md"
          $flags = @()
          if ($version -match '-') { $flags += '--prerelease' }
          if (-not $resumeDraft) {
            gh release create $tag --target $env:GITHUB_SHA --draft --title "Image Draw Bot $tag" --notes-file $notes @flags
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release draft' }
          }
          gh release upload $tag --clobber release/ImageDrawBot-*-Windows-x64.zip release/ImageDrawBot-*-Windows-x64-Setup.exe release/ImageDrawBot-*-SHA256.txt release/ImageDrawBot-*-manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload verified release assets' }
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release' }

      - name: Prepare one-time retirement of releases before v1.0.146-rc3
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/tags/v1.0.146-rc3'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from Version import APP_VERSION; print(APP_VERSION)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($version -ne '1.0.146-rc3') { exit 0 }
          python release_cleanup.py --snapshot docs/history/archives/release-retirement-v1.0.146-rc3.json --keep-tag v1.0.146-rc3 --expected-commit $env:GITHUB_SHA --report release/retirement-v1.0.146-rc3-plan.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'RC3_CLEANUP_READY=true' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Preserve release and tag retirement inventory
        if: env.RC3_CLEANUP_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ImageDrawBot-v1.0.146-rc3-retirement-inventory
          path: |
            docs/history/archives/release-retirement-v1.0.146-rc3.json
            release/retirement-v1.0.146-rc3-plan.json
          if-no-files-found: error
          retention-days: 90

      - name: Retire the verified snapshot of old releases and tags
        if: env.RC3_CLEANUP_READY == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python release_cleanup.py --snapshot docs/history/archives/release-retirement-v1.0.146-rc3.json --keep-tag v1.0.146-rc3 --expected-commit $env:GITHUB_SHA --report release/retirement-v1.0.146-rc3-result.json --apply
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

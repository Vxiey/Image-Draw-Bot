name: Build, verify, and optionally publish Image Draw Bot Windows release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the verified release from main (explicit release approval required)'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'Version.py'
      - '.github/release-build-trigger'

permissions:
  contents: read
  actions: read

concurrency:
  # Pushes only build/verify. Publication requires an explicit manual request
  # from main. Serialize runs so release assets cannot mix between publishers.
  group: image-draw-bot-release
  cancel-in-progress: false
  queue: max

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.release_artifact.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'

      - name: Install source dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Source package hygiene gate
        shell: pwsh
        run: |
          python ReleasePackage.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Release source gate
        shell: pwsh
        run: |
          python ReleaseCandidateHardening.py --source-gate --soak-cycles 5000
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build verified Windows release
        shell: pwsh
        run: |
          python build_release.py --installer --skip-tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate packaged GUI and native drag and drop
        shell: pwsh
        run: |
          python -c "import subprocess; subprocess.run(['dist/ImageDrawBot/ImageDrawBot.exe', '--smoke-test'], check=True, timeout=90)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate packaged release
        shell: pwsh
        run: |
          python ReleaseCandidateHardening.py --release-dir release --strict-inventory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Read the verified source version
        id: release_version
        shell: pwsh
        run: |
          $version = python -c "from Version import APP_VERSION; print(APP_VERSION)"
          if ($LASTEXITCODE -ne 0 -or $version -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-(?:rc[0-9]+|beta))?$') {
            throw 'The checkout must identify a valid release version.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Validate silent installer round-trip
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-Item -LiteralPath "release/ImageDrawBot-${env:RELEASE_VERSION}-Windows-x64-Setup.exe"

          $installDir = Join-Path $env:RUNNER_TEMP 'ImageDrawBot-release-install'
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }

          Write-Host "Installing $($setup.Name) to $installDir"
          $installProcess = Start-Process -FilePath $setup.FullName `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$installDir") `
            -Wait -PassThru
          Write-Host "Installer exit code: $($installProcess.ExitCode)"
          if ($installProcess.ExitCode -ne 0) { throw "Silent install failed: $($installProcess.ExitCode)" }

          $exe = Join-Path $installDir 'ImageDrawBot.exe'
          if (-not (Test-Path $exe)) { throw "Installed ImageDrawBot.exe is missing at $exe" }
          $icon = Join-Path $installDir '_internal\assets\image-draw-bot-icon.ico'
          if (-not (Test-Path $icon)) { throw "Installed taskbar icon is missing: $icon" }
          $shortcutPath = Join-Path ([Environment]::GetFolderPath('Programs')) 'Image Draw Bot/Image Draw Bot.lnk'
          if (-not (Test-Path $shortcutPath)) { throw 'Start-menu shortcut is missing' }
          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $shell.CreateShortcut($shortcutPath)
          if ($shortcut.IconLocation -ne "$icon,0") { throw "Shortcut uses unexpected icon: $($shortcut.IconLocation)" }
          Write-Host 'Installed shortcut icon verified'
          Write-Host 'Running installed ImageDrawBot.exe --self-test'
          $selfTestProcess = Start-Process -FilePath $exe -ArgumentList @('--self-test') -Wait -PassThru
          Write-Host "Installed self-test exit code: $($selfTestProcess.ExitCode)"
          if ($selfTestProcess.ExitCode -ne 0) { throw "Installed self-test failed: $($selfTestProcess.ExitCode)" }

          $uninstall = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path $uninstall)) { throw "Uninstaller is missing at $uninstall" }
          Write-Host 'Running silent uninstall'
          $uninstallProcess = Start-Process -FilePath $uninstall -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          Write-Host "Uninstaller exit code: $($uninstallProcess.ExitCode)"
          if ($uninstallProcess.ExitCode -ne 0) { throw "Silent uninstall failed: $($uninstallProcess.ExitCode)" }

      - name: Verify upgrade from the published stable release preserves profile settings
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          ./.github/scripts/test-release-upgrade.ps1 `
            -CandidateInstaller "release/ImageDrawBot-${env:RELEASE_VERSION}-Windows-x64-Setup.exe" `
            -CandidateExe 'dist/ImageDrawBot/ImageDrawBot.exe' `
            -CandidateVersion $env:RELEASE_VERSION

      - name: Run complete regressions and self-test
        shell: pwsh
        run: |
          python -u .github/scripts/run-regressions.py discover -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python DrawBot.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload workflow artifacts
        id: release_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ImageDrawBot-${{ github.ref_name }}-Windows-x64
          path: |
            release/ImageDrawBot-${{ steps.release_version.outputs.version }}-Windows-x64.zip
            release/ImageDrawBot-${{ steps.release_version.outputs.version }}-Windows-x64-Setup.exe
            release/ImageDrawBot-${{ steps.release_version.outputs.version }}-SHA256.txt
            release/ImageDrawBot-${{ steps.release_version.outputs.version }}-manifest.json
          if-no-files-found: error
          retention-days: 30

  publish-windows:
    needs: build-windows
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Require passing CI for the exact release commit
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python ReleaseCandidateHardening.py --scope-gate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ReleaseCiGate.py --expected-commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require an exact artifact ID
        shell: pwsh
        env:
          BUILD_ARTIFACT_ID: ${{ needs.build-windows.outputs.artifact-id }}
        run: |
          if ($env:BUILD_ARTIFACT_ID -notmatch '^[1-9][0-9]*$') { throw 'Missing build artifact ID.' }

      - name: Download this run's verified Windows build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.build-windows.outputs.artifact-id }}
          path: release

      - name: Revalidate downloaded release files
        shell: pwsh
        run: |
          python ReleaseCandidateHardening.py --release-dir release --strict-inventory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish verified versioned release
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from Version import APP_VERSION; print(APP_VERSION)"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the release version from the checkout.' }
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Tag does not match build version' }
          $existing = gh release view $tag --json isDraft,targetCommitish 2>$null
          $resumeDraft = $false
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            if (-not $release.isDraft) {
              Write-Host 'This version is already published. Increment APP_VERSION to publish an update.'
              exit 0
            }
            if ($release.targetCommitish -ne $env:GITHUB_SHA) { throw 'Draft belongs to a different commit; use a new version.' }
            $resumeDraft = $true
          }
          python ReleaseIdentity.py --tag $tag --expected-commit $env:GITHUB_SHA --create-missing-tag
          if ($LASTEXITCODE -ne 0) { throw 'Release tag does not match the build commit' }
          $notes = "RELEASE-NOTES-v$version.md"
          $flags = @()
          if ($version -match '-') { $flags += '--prerelease' }
          if (-not $resumeDraft) {
            gh release create $tag --verify-tag --target $env:GITHUB_SHA --draft --title "Image Draw Bot $tag" --notes-file $notes @flags
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release draft' }
          }
          $assets = @(
            "release/ImageDrawBot-$version-Windows-x64.zip"
            "release/ImageDrawBot-$version-Windows-x64-Setup.exe"
            "release/ImageDrawBot-$version-SHA256.txt"
            "release/ImageDrawBot-$version-manifest.json"
          )
          gh release upload $tag --clobber @assets
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload verified release assets' }
          python ReleaseIdentity.py --tag $tag --expected-commit $env:GITHUB_SHA --verify-draft-assets @assets
          if ($LASTEXITCODE -ne 0) { throw 'Release tag, draft or uploaded assets failed verification' }
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release' }

      - name: Prepare one-time retirement of releases before v1.0.146-rc3
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from Version import APP_VERSION; print(APP_VERSION)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($version -ne '1.0.146-rc3') { exit 0 }
          python release_cleanup.py --snapshot docs/history/archives/release-retirement-v1.0.146-rc3.json --keep-tag v1.0.146-rc3 --expected-commit $env:GITHUB_SHA --report release/retirement-v1.0.146-rc3-plan.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'RC3_CLEANUP_READY=true' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Preserve release and tag retirement inventory
        if: env.RC3_CLEANUP_READY == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ImageDrawBot-v1.0.146-rc3-retirement-inventory
          path: |
            docs/history/archives/release-retirement-v1.0.146-rc3.json
            release/retirement-v1.0.146-rc3-plan.json
          if-no-files-found: error
          retention-days: 90

      - name: Retire the verified snapshot of old releases and tags
        if: env.RC3_CLEANUP_READY == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python release_cleanup.py --snapshot docs/history/archives/release-retirement-v1.0.146-rc3.json --keep-tag v1.0.146-rc3 --expected-commit $env:GITHUB_SHA --report release/retirement-v1.0.146-rc3-result.json --apply
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

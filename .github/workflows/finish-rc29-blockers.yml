name: Finish rc29 merge blockers

on:
  push:
    branches:
      - feature/stability-planner-validation-rc29
    paths:
      - .github/workflows/finish-rc29-blockers.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/stability-planner-validation-rc29
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow numpy

      - name: Patch exact rc29 blockers
        shell: python
        run: |
          from pathlib import Path

          auto = Path('AutoDrawing.py')
          text = auto.read_text(encoding='utf-8')
          old = """def resolve_drawing(image,options):\n    out=apply_drawing_style(image,dict(options));preset=out.get('render_preset','Manual')\n    if preset not in PRESETS:raise ValueError('Choose Auto, Manual, Masterpiece or Extra fast.')\n"""
          new = """def resolve_drawing(image,options):\n    raw=dict(options);preset=raw.get('render_preset','Manual')\n    if preset not in PRESETS:raise ValueError('Choose Auto, Manual, Masterpiece or Extra fast.')\n    # Manual means the caller owns every setting. Auto Drawing Style must not\n    # inject resolved style metadata or alter manual controls unless the user\n    # explicitly selected a non-Auto drawing style.\n    if preset=='Manual' and raw.get('drawing_style','Auto')=='Auto':return raw\n    out=apply_drawing_style(image,raw);preset=out.get('render_preset','Manual')\n"""
          if text.count(old) != 1:
              raise SystemExit('AutoDrawing.py expected resolve_drawing anchor exactly once')
          auto.write_text(text.replace(old,new),encoding='utf-8')

          draw = Path('DrawBot.py')
          text = draw.read_text(encoding='utf-8')
          old = "                report('status',f\"Completed Drawing Analysis: accuracy {_score_label} · {len(analysis_meta.get('recommendations') or ())} optimization suggestion(s) saved.\")\n"
          if text.count(old) != 1:
              raise SystemExit('DrawBot.py expected Completed Drawing Analysis status anchor exactly once')
          # Analytics are persisted and logged, but must not replace the terminal
          # Finished... event after a successful execution.
          draw.write_text(text.replace(old,''),encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          marker = '\n## AutoDraw for Microsoft Paint, Gartic Phone and Skribbl.io\n'
          if marker not in text:
              raise SystemExit('README download-section boundary missing')
          head,tail = text.split(marker,1)
          if '1.0.145-rc26' not in head:
              raise SystemExit('README current release block is not rc26 as expected')
          head=head.replace('1.0.145-rc26','1.0.145-rc29')
          readme.write_text(head+marker+tail,encoding='utf-8')

      - name: Compile patched sources
        run: python -m py_compile AutoDrawing.py DrawBot.py

      - name: Run the three previously failing regressions
        run: |
          python -m unittest -v \
            test_auto_clear_v10102.AutoClearTests.test_auto_selects_from_image_and_keeps_manual \
            test_drawbot.Tests.test_complete_and_single_palette_click \
            test_step21_release_cleanup_v10144.Step21ReleaseCleanupTests.test_readme_and_release_docs_are_current

      - name: Commit product fixes and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finish-rc29-blockers.yml
          git add AutoDrawing.py DrawBot.py README.md
          git commit -m "Fix rc29 Windows regression blockers"
          git push origin HEAD:feature/stability-planner-validation-rc29

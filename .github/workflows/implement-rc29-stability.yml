name: Integrate rc29 stability and planner validation

on:
  push:
    branches:
      - feature/stability-planner-validation-rc29

permissions:
  contents: write

concurrency:
  group: integrate-rc29-stability
  cancel-in-progress: false

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[rc29-integrated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout rc29
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/stability-planner-validation-rc29

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply rc29 patch
        run: python .github/scripts/implement_rc29_stability.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile patched sources
        run: python -m compileall -q .

      - name: Run rc29 focused regressions
        run: >-
          python -m unittest -v
          test_rc29_stability_planner_validation.py
          test_rc12_eta_calibration.py
          test_draw_time_calibration_v10117.py

      - name: Run portable planner regressions
        run: >-
          python -m unittest -v
          test_raster_identity.py
          test_extra_fast_review.py
          test_hybrid_cost_engine_v10131.py
          test_engine_finalization_v10132.py
          test_step17_golden_image_regression_v10141.py

      - name: Validate release package hygiene
        run: python ReleasePackage.py --check

      - name: Commit integrated rc29
        shell: bash
        run: |
          git config user.name "Image Draw Bot CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No rc29 changes to commit"
            exit 0
          fi
          git commit -m "Complete rc29 stability and planner validation [rc29-integrated]"
          git push origin HEAD:feature/stability-planner-validation-rc29
